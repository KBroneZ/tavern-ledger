[package]
name = "game-memory"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Read-only reader for two values the game shows the player: the lobby's tribes and the player's own Battlegrounds rating (D-063)"

[dependencies]

# Read and query rights only (D-063): no write, thread or debug features.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
