[package]
name = "combat-sim"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Battlegrounds combat simulator: odds to win, tie or lose from two boards (F6, T-602)"

[features]
# The validation harness (T-603): reads saved games and HearthstoneJSON card
# data. Off for a WebAssembly build, which needs only the engine (no deps).
default = ["harness"]
harness = ["dep:serde_json"]

[dependencies]
# Already in Cargo.lock through bg-parser (PROVENANCE.md); no new crates.
serde_json = { version = "1", optional = true }

[[bin]]
name = "combat-validate"
path = "src/bin/combat_validate.rs"
required-features = ["harness"]
