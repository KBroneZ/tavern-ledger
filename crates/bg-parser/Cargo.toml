[package]
name = "bg-parser"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rebuilds Hearthstone Battlegrounds games from the local Power.log"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "bg-parse"
path = "src/main.rs"
