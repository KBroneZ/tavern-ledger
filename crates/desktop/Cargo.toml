[package]
name = "desktop"
version = "0.2.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Tavern Ledger desktop app (Tauri)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# The Microsoft Store edition (D-158, T-379): no self-update, the Store's
# start-up task in place of the Run key. Read in src/edition.rs only.
store = []
# The Store edition without the `unvirtualizedResources` capability: no Fix
# button, the setup box lists the lines to write by hand (src/edition.rs).
store-manual-setup = ["store"]

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
# Self-update from the project's signed GitHub releases (T-105b). Windows'
# own TLS like the uploader; no zip (only for Tauri v1 update bundles).
tauri-plugin-updater = { version = "=2.13.1", default-features = false, features = ["native-tls", "system-proxy"] }
# The verifier the plugin uses; here only to tell a real public key from the
# placeholder before the plugin is turned on.
minisign-verify = "0.3"
base64 = "0.23"
# The updater's HTTP client, to refuse redirects that leave https.
reqwest = { version = "0.13", default-features = false }
# The system's folder picker for "Hearthstone folder" in the settings (T-579).
# Pinned, a release from January 2026; no default features (no Linux portals).
rfd = { version = "=0.17.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Redacts the error log's lines (T-580): names, ids, emails, tokens, paths.
regex = "1"
bg-parser = { path = "../bg-parser" }
tracker = { path = "../tracker" }
uploader = { path = "../uploader", features = ["http"] }
cards = { path = "../cards", features = ["http"] }
game-memory = { path = "../game-memory" }

[dev-dependencies]
# A mock app and runtime to drive the real updater plugin in tests.
tauri = { version = "2.12", features = ["tray-icon", "test"] }
# Throwaway signing keys made inside the updater tests; never a real key.
minisign = "=0.10.0"

[target.'cfg(windows)'.dependencies]
# Already in the build through auto-launch; quotes the start-up entry.
winreg = "0.56"
# The WebView2 check's message box (both editions), the Store edition's
# start-up task (WinRT `StartupTask`) and its check for package identity.
# Already in the lock through Tauri's WebView2 binding.
windows = { version = "0.62", default-features = false, features = [
  "ApplicationModel",
  "ApplicationModel_Activation",
  "Foundation",
  "Win32_Foundation",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_WinRT",
  "Win32_UI_WindowsAndMessaging",
] }
