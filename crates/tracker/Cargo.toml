[package]
name = "tracker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Follows Hearthstone's Power.log and stores finished Battlegrounds games locally"

[dependencies]
bg-parser = { path = "../bg-parser" }
# The combat simulator (T-605), without the harness and its dependencies.
combat-sim = { path = "../combat-sim", default-features = false, features = ["saved"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Already in the build; reads the game's Uninstall keys without reg.exe.
winreg = "0.56"
# Counts the hard links of a config file before the Fix button writes it
# (D-154); already in the build through game-memory and the uploader.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[[bin]]
name = "tavern-watch"
path = "src/main.rs"
