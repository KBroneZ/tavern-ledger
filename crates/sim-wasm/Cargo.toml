[package]
name = "sim-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The combat simulator for the website (T-606): a thin WebAssembly wrapper, JSON in and JSON out"

[lib]
# cdylib: the .wasm file; rlib: the native tests call the same code.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Both already in Cargo.lock (PROVENANCE.md); no new crates.
combat-sim = { path = "../combat-sim", default-features = false }
serde_json = "1"

[dev-dependencies]
# The parity test runs the app's own odds code on the same boards.
bg-parser = { path = "../bg-parser" }
tracker = { path = "../tracker" }
