name: Advisories daily

# Every day, the advisory scan (advisories.yml) on main, so an advisory
# published after the last change still shows up. When it fails, one issue,
# "Advisory scan failing on main", gets a comment with the run's link (it is
# opened if no open issue has that title). It only reads the repository and
# writes that issue; it changes no file.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisories-daily
  cancel-in-progress: false

jobs:
  scan:
    uses: ./.github/workflows/advisories.yml
    permissions:
      contents: read

  # Runs only when the scan failed.
  report:
    needs: [scan]
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Advisory scan failing on main"
          body="The daily advisory scan failed: $RUN_URL"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
