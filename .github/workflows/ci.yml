name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job on purpose: each job boots its own runner, so splitting
  # tests, links and secrets would roughly triple the minutes used.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Pure-Python wheels only, every file checked against its pinned hash.
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests -v

      # Website (web/): unit tests, a static build with placeholder settings
      # (no Supabase in CI) and the checks on the built files (CSP, nothing
      # inlined, no key but the public one). npm runs no install scripts
      # (web/.npmrc).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Website
        working-directory: web
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: sb_publishable_placeholder
        run: |
          npm ci
          npm test
          npm run build
          npm run test:dist

      # Rust workspace on the runner's preinstalled stable toolchain: format,
      # unit tests and parity of bg-parser with tools/parse_bg.py. The Tauri
      # app (desktop) needs Windows/WebKit system libraries and is built
      # locally for now.
      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust tests
        run: cargo test --locked --workspace --exclude desktop

      - name: Parser fixtures match the Python prototype
        run: |
          python tools/gen_parser_fixtures.py
          git diff --exit-code -- crates/bg-parser/tests/data

      # Offline: only relative links between repo files. External sites
      # (Blizzard, GitHub) rate-limit or block CI runners and would make CI flaky.
      - name: Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --max-time 60 -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks

      - name: Secrets scan (full history)
        run: ./gitleaks git --redact --verbose .
