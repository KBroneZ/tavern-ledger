name: CI

on:
  push:
    branches: [main, 130-ci-coverage]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Rust toolchain every job uses. Keep it equal to the compiler that
  # built the committed website engine (rustc in web/src/lib/sim/engine.stamp.json):
  # the `engine` job rebuilds it and compares the bytes.
  RUST_VERSION: 1.96.0

# Runners are pinned to an image (not `*-latest`), toolchains to a version and
# every third-party action to a full commit SHA (tools/check_action_pins.py
# fails the `repo` job on one that is not). Dependabot proposes the bumps.
jobs:
  # The required check. It passes only when every job below passed, so the
  # protection that asks for `check` covers all of them without a settings
  # change. `if: always()` matters: a skipped job would otherwise count as green.
  check:
    needs: [repo, desktop, engine, functions, database]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  # Python, website, Rust workspace without the desktop app, licenses,
  # links and secrets: everything that runs on Linux. One job on purpose:
  # each job boots its own runner, so splitting these would repeat the setup.
  repo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"

      # Pure-Python wheels only, every file checked against its pinned hash.
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests -v

      # A workflow action that is not pinned by full commit SHA fails here.
      - name: Actions are pinned
        run: python tools/check_action_pins.py

      # Website (web/): unit tests, then two static builds, each followed by
      # the checks on the built files (CSP, nothing inlined, no key but the
      # public one): accounts open with placeholder settings (no Supabase in
      # CI), and accounts closed with no settings, as deployed today (no
      # form, no script). npm runs no install scripts (web/.npmrc).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Website
        working-directory: web
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: sb_publishable_placeholder
          # The simulator's card data from synthetic files, not HearthstoneJSON
          # (the Pages build fetches the real one; T-606, D-090).
          SIM_CARDS_DIR: test/fixtures/sim-cards
        run: |
          npm ci
          npm test
          npm run build
          npm run test:dist
          PUBLIC_SIGNUPS_OPEN=true npm run build
          PUBLIC_SIGNUPS_OPEN=true npm run test:dist
          env -u PUBLIC_SUPABASE_URL -u PUBLIC_SUPABASE_ANON_KEY npm run build
          env -u PUBLIC_SUPABASE_URL -u PUBLIC_SUPABASE_ANON_KEY npm run test:dist

      # Rust workspace on the pinned toolchain: format, unit tests and parity
      # of bg-parser with tools/parse_bg.py. The Tauri app (desktop) needs
      # Windows system libraries: its tests run in the `desktop` job.
      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          rustup default "$RUST_VERSION"

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust tests
        run: cargo test --locked --workspace --exclude desktop

      # Every crate in Cargo.lock and package in the npm lockfiles has a
      # license compatible with AGPL-3.0-only; our own ones say AGPL-3.0-only
      # (D-101). Standard library only, after the Rust tests fetched the crates.
      - name: Dependency licenses
        run: python tools/check_licenses.py

      - name: Parser fixtures match the Python prototype
        run: |
          python tools/gen_parser_fixtures.py
          git diff --exit-code -- crates/bg-parser/tests/data

      # Offline: only relative links between repo files. External sites
      # (Blizzard, GitHub) rate-limit or block CI runners and would make CI flaky.
      - name: Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --no-progress --include-fragments --exclude-path 'node_modules' './**/*.md'
          fail: true

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --max-time 60 -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks

      - name: Secrets scan (full history)
        run: ./gitleaks git --redact --verbose .

  # The desktop app, which is what players install: it builds on Windows only,
  # so it runs there. Its tests include the window's content security policy
  # (card_data.rs), the pages' markup checks (ui_checks.rs) and the browser-side
  # scripts' tests (crates/desktop/ui-tests, run by Node).
  desktop:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.node-version

      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: App ui-tests
        working-directory: crates/desktop
        run: node --test "ui-tests/*.test.js"

      # Builds the app and everything it links, then runs its tests, which
      # run the ui-tests again through ui_checks.rs. game-memory is the
      # Windows-only process reader; its tests need the Windows API too.
      - name: Desktop tests
        run: cargo test --locked -p desktop -p game-memory

  # The website's combat engine is committed as a binary (the Pages build has
  # no Rust). A fresh build must give the same bytes, or the committed file
  # is not what the sources say. The build embeds Windows path separators
  # (paths are remapped, the separators stay), so only a Windows build matches
  # the committed file byte for byte.
  engine:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.node-version

      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"

      - name: Rebuild the engine
        working-directory: web
        run: node tools/build-sim-wasm.ts

      - name: Rebuilt engine equals the committed one
        run: |
          git diff --exit-code -- web/src/lib/sim/engine.wasm web/src/lib/sim/engine.stamp.json || {
            echo "::error::web/src/lib/sim/engine.wasm is not what its sources build to. Run 'node tools/build-sim-wasm.ts' in web/ and commit the result."
            exit 1
          }

  # The Edge Functions' tests. Deno is not a third-party action: the release
  # file is downloaded from the project's releases and checked against its
  # SHA-256 (also in the release's own .sha256sum), like gitleaks above.
  functions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DENO_VERSION: 2.8.0
      DENO_SHA256: be2c8b53c8ca1d66be76feb9b1a524419da708b00d4ca074cf5c633c81c1627b
      DENO_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Deno (pinned, checksum verified)
        run: |
          zip="deno-x86_64-unknown-linux-gnu.zip"
          curl -sSfL --max-time 120 -o "$RUNNER_TEMP/$zip" \
            "https://github.com/denoland/deno/releases/download/v${DENO_VERSION}/${zip}"
          echo "${DENO_SHA256}  $RUNNER_TEMP/${zip}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/deno"
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/deno"
          echo "$RUNNER_TEMP/deno" >> "$GITHUB_PATH"

      # The functions import nothing from the network, so none is allowed.
      - name: Edge Function tests
        run: deno test --no-remote supabase/functions/

  # Row-level security, grants, export, deletion and the other database
  # rules, on the local stack the CLI starts in Docker. Only what the tests
  # need: the database, auth and storage (their schemas) and the gateway.
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.node-version
          cache: npm

      # The Supabase CLI is the version pinned in package.json; its install
      # script downloads the binary.
      - name: Install the Supabase CLI
        run: npm ci

      - name: Start the local stack
        run: >
          npx supabase start
          -x studio,postgres-meta,mailpit,imgproxy,edge-runtime,logflare,vector,realtime,supavisor

      - name: pgTAP tests
        run: npx supabase test db
