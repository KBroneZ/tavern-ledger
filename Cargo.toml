[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
edition = "2021"
# File::try_lock (D-016)
rust-version = "1.89"
license = "AGPL-3.0-only"
publish = false

# The website's WebAssembly engine (crates/sim-wasm, T-606): small and
# self-contained. Used only by web/tools/build-sim-wasm.ts.
[profile.sim-wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
