# Advisories tools/check_advisories.py lets pass, each with why it does not
# apply here. Every field is required. `review_by` is when the entry fails
# the check until someone looks again and moves the date (or removes the
# entry). For a crate, `absent_from` lists the builds the crate must not be
# in: the check reads `cargo metadata` for each target (minus the `exclude`
# workspace crates) and fails the moment the crate gets into one of them.
# A crate that is built can only be let through with `used_only_by`, when the
# advisory needs something only some callers could do: it lists, per crate,
# every crate allowed to depend on it, and the check fails the moment another
# crate depends on one of them in any build (Windows, Linux, wasm).
#
# Builds today: the desktop app ships for Windows only (x86_64-pc-windows-msvc,
# also its CI tests); CI builds and tests the rest of the workspace on Linux
# without `desktop`; the website's engine is wasm32-unknown-unknown.

[[ignore]]
id = "RUSTSEC-2024-0429"
package = "glib"
reason = "Unsound VariantStrIter (glib::VariantStrIter::next and friends); glib is only a Linux dependency of Tauri's GTK webview, and no build of ours compiles it."
evidence = "cargo tree -i glib: nothing for x86_64-pc-windows-msvc or wasm32-unknown-unknown; on x86_64-unknown-linux-gnu only through tauri -> desktop, and the Linux CI build excludes desktop (2026-10-23)."
review_by = 2027-01-23
absent_from = [
  { target = "x86_64-pc-windows-msvc" },
  { target = "wasm32-unknown-unknown" },
  { target = "x86_64-unknown-linux-gnu", exclude = ["desktop"] },
]

[[ignore]]
id = "RUSTSEC-2024-0370"
package = "proc-macro-error"
reason = "Informational: the crate is unmaintained, no vulnerability. It is a build-time macro of glib-macros, which only the Linux GTK stack uses."
evidence = "cargo tree -i proc-macro-error: only through glib-macros -> glib on x86_64-unknown-linux-gnu, which comes from tauri -> desktop; not in the Windows, wasm or Linux CI builds (2026-10-23)."
review_by = 2027-01-23
absent_from = [
  { target = "x86_64-pc-windows-msvc" },
  { target = "wasm32-unknown-unknown" },
  { target = "x86_64-unknown-linux-gnu", exclude = ["desktop"] },
]

[[ignore]]
id = "GHSA-qwgh-2vcv-g2f7"
package = "block-buffer"
reason = "A panic inside the compress callback that digest_blocks calls, caught and followed by more use of the buffer, corrupts its cursor. block-buffer 0.10 is only reached through digest 0.10, whose only hash core here is sha2 0.10 (hmac and pbkdf2 are generic over it): SHA-2 block compression is fixed arithmetic with no panic path, so the callback never panics. The fix (0.12.1) needs digest 0.11; sha2 0.10 comes from wry 0.57.0 and tauri-codegen 2.7.3, and the newest Tauri 2 releases (wry 0.57.1, tauri-codegen 2.7.3) still require sha2 ^0.10."
evidence = "cargo metadata per target: block-buffer 0.10.4 <- digest 0.10.7 <- sha2 0.10.9, hmac 0.12.1, pbkdf2 0.12.2 on Windows, Linux and wasm; crates.io dependencies of wry 0.57.1 and tauri-codegen 2.7.3 both sha2 ^0.10 (2026-10-27)."
review_by = 2027-01-27
used_only_by = [
  { package = "block-buffer", dependents = ["digest"] },
  { package = "digest", dependents = ["sha2", "hmac", "pbkdf2"] },
]
